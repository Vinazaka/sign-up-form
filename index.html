<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <div class="main">
        <div class="image">
            <img src="https://images.unsplash.com/photo-1585202900225-6d3ac20a6962?q=80&w=774&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Green Leaf Plant">
            <div class="odin-logo">
                <img class="logo-img" src="https://cdn.statically.io/gh/TheOdinProject/curriculum/5f37d43908ef92499e95a9b90fc3cc291a95014c/html_css/project-sign-up-form/odin-lined.png" alt="Odin Logo">
                <h1>ODIN</h1>
            </div>
        </div>
        <div class="content-container">
            <p class="long-sentence">This is not a real online service! You know you need something like this in your like to help you realize your deepest dreams.</p>
            <p>Sign up <em>now</em> to get started.</p>
            <p>You <em>know</em> you want to.</p>

            <form>
                <p>Let's do this!</p>

                <label for="first_name">First Name:</label>
                <input type="text" id="first_name" name="first_name">

                <label for="last_name">Last Name:</label>
                <input type="text" id="last_name" name="last_name">

                <label for="user_email">Email Address:</label>
                <input type="email" id="user_email" name="email">

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone">

                <label for="user_password">Password:</label>
                <input type="password" id="user_password" name="password">

                <label for="confirm_user_password">Confirm Password:</label>
                <input type="password" id="confirm_user_password" name="confirm_user_password">
            </form>
        </div>
    </div>
</body>
</html>
